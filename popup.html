<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Placeholderin</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        width: 240px;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        color: #1f2937;
        background: #fff;
      }

      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 14px;
        background: #4f46e5;
        color: #fff;
      }

      header img { width: 24px; height: 24px; }

      header h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.01em; }

      header span {
        margin-left: auto;
        font-size: 10px;
        opacity: 0.7;
      }

      main { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }

      #actions { display: flex; flex-direction: column; gap: 8px; }

      button {
        width: 100%;
        padding: 10px 14px;
        border: none;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        background: #4f46e5;
        color: #fff;
        transition: background 0.15s;
      }

      button:hover  { background: #4338ca; }
      button:last-child {
        background: none;
        color: #6b7280;
        font-size: 11px;
        padding: 4px;
        text-decoration: underline;
      }

      button:last-child:hover { color: #374151; background: none; }

      #status {
        font-size: 11px;
        color: #6b7280;
        text-align: center;
        min-height: 16px;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/icon32.png" alt="" />
      <h1>Placeholderin</h1>
      <span>v0.1.0-dev</span>
    </header>
    <main>
      <div id="actions"></div>
      <div id="status"></div>
    </main>
    <script src="dist/popup/index.js"></script>
  </body>
</html>
