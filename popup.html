<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Placeholderin</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        width: 260px;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 13px;
        color: #1f2937;
        background: #f9fafb;
      }

      /* -- header -- */
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 14px;
        background: #4f46e5;
        color: #fff;
      }

      header img { width: 22px; height: 22px; border-radius: 4px; }

      header h1 {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      header span {
        margin-left: auto;
        font-size: 10px;
        opacity: 0.6;
        font-weight: 400;
      }

      /* -- main -- */
      main { padding: 12px; display: flex; flex-direction: column; gap: 10px; }

      /* -- primary button -- */
      .btn-primary {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 11px 14px;
        background: #4f46e5;
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s, box-shadow 0.15s;
        box-shadow: 0 1px 3px rgba(79,70,229,.3);
      }

      .btn-primary:hover { background: #4338ca; box-shadow: 0 2px 6px rgba(79,70,229,.4); }
      .btn-primary:active { background: #3730a3; }

      /* -- section label -- */
      .section-label {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #9ca3af;
        padding: 0 2px;
      }

      /* -- grid -- */
      #action-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 7px;
      }

      /* -- field buttons -- */
      .btn-field {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        padding: 10px 6px 9px;
        background: #fff;
        color: #374151;
        border: 1.5px solid #e5e7eb;
        border-radius: 10px;
        font-size: 11px;
        font-weight: 500;
        cursor: pointer;
        transition: border-color 0.15s, background 0.15s, color 0.15s;
        line-height: 1.2;
        text-align: center;
      }

      .btn-field:hover {
        border-color: #a5b4fc;
        background: #eef2ff;
        color: #4f46e5;
      }

      .btn-field:active { background: #e0e7ff; }

      /* -- icon -- */
      .btn-icon { font-size: 18px; line-height: 1; }

      .btn-primary .btn-icon { font-size: 14px; }

      /* -- status -- */
      #status {
        font-size: 11px;
        color: #6b7280;
        text-align: center;
        min-height: 14px;
      }

      /* -- footer -- */
      #action-footer { display: flex; justify-content: center; }

      .btn-settings {
        display: flex;
        align-items: center;
        gap: 5px;
        background: none;
        border: none;
        color: #9ca3af;
        font-size: 11px;
        cursor: pointer;
        padding: 2px 6px;
        border-radius: 6px;
        transition: color 0.15s;
      }

      .btn-settings:hover { color: #4f46e5; }

      .btn-settings .btn-icon { font-size: 13px; }

      /* -- disabled state -- */
      button:disabled { opacity: 0.45; pointer-events: none; }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/icon32.png" alt="" />
      <h1>Placeholderin</h1>
      <span>v0.1.0</span>
    </header>
    <main>
      <div id="action-primary"></div>
      <div class="section-label" data-i18n="popupSectionFields">Individual fields</div>
      <div id="action-grid"></div>
      <div id="status"></div>
      <div id="action-footer"></div>
    </main>
    <script src="dist/popup/index.js"></script>
  </body>
</html>
